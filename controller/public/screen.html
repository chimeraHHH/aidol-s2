<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="referrer" content="no-referrer"><title>窝知 · 手机显示屏</title><link rel="stylesheet" href="/style.css"></head>
<body class="screen-body"><div id="display"><video id="player" loop muted playsinline preload="auto" disablepictureinpicture poster="/media/sleep.jpg"></video><div id="start-overlay" class="screen-overlay"><div><span class="eyebrow">WOZHI / DISPLAY</span><h1>让窝知醒过来。</h1><p id="start-message">连接后，手机将循环播放电脑选择的画面。</p><button id="start" class="primary">开始全屏播放</button><a href="/" id="back-link">还没有配对？打开电脑控制台</a></div></div><button id="fullscreen-prompt" hidden>⛶ 轻点进入全屏</button><button id="screen-menu-toggle" class="screen-menu-toggle" aria-label="显示屏设置">···</button><div id="screen-menu" hidden><strong>窝知显示屏</strong><p id="network-status">正在连接…</p><button id="fullscreen">恢复全屏</button><button id="enable-audio">允许视频声音</button><button id="hide-menu">收起</button><small>断网时当前视频继续循环，联网后自动同步。</small></div><div id="screen-notice" role="status" hidden></div></div><script type="module" src="/assets/screen.js"></script></body></html>
